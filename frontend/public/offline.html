<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>HyprLead Offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
        color: #fff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(16, 185, 129, 0.2), transparent 30rem),
          radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.16), transparent 28rem),
          #000;
      }

      main {
        width: min(34rem, calc(100vw - 3rem));
        padding: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(10, 10, 10, 0.72);
        box-shadow: 0 2rem 6rem rgba(0, 0, 0, 0.45);
      }

      img {
        width: 4rem;
        height: 4rem;
        object-fit: cover;
        border-radius: 1rem;
        margin-bottom: 1.5rem;
      }

      p {
        color: #a1a1aa;
        line-height: 1.7;
        margin: 0 0 1.5rem;
      }

      h1 {
        font-size: clamp(2rem, 7vw, 4.5rem);
        line-height: 0.95;
        margin: 0 0 1rem;
        letter-spacing: 0;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #10b981;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 0.85rem 1.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Offline mode</h1>
      <p>
        HyprLead is installed and ready, but this screen needs a network connection before it can refresh live campaign data.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
